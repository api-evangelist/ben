aid: ben
name: Ben
description: >-
  Ben (thanksben.com) is an AI-native global employee benefits and rewards platform for
  enterprises. It unifies benefits eligibility rules, policy configuration, employee enrollment
  and access, spend and compliance dashboards, and rewards/recognition into a single system
  spanning 140+ countries, replacing fragmented regional benefits tooling. Customers include
  Moet, Henkel, Virgin, Zalando, Deliveroo, and Octopus Energy. Ben is backed by Seedcamp and
  was added to the API Evangelist network as a portfolio company; it publishes no public
  developer API today, so this profile captures the company's identity and its public security
  and trust surface (RFC 9116 security.txt, a Vanta-hosted Trust Center, and probed domain
  security).
